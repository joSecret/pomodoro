name: Build

# Every push to main builds the macOS .dmg.
# Windows and Linux builds run on version tags (v1.0.0) or when started by hand.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Also build Windows and Linux'
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: Focus Flow

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build macos --release
      - name: Ad-hoc sign the app
        # Without an Apple Developer ID the app can only be ad-hoc signed.
        # Re-signing the whole bundle keeps the signature consistent, so
        # macOS does not report the app as damaged after download.
        run: |
          APP="build/macos/Build/Products/Release/${APP_NAME}.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Smoke test (launch the app and take a screenshot)
        run: |
          APP="build/macos/Build/Products/Release/${APP_NAME}.app"
          "$APP/Contents/MacOS/${APP_NAME}" > launch.log 2>&1 &
          PID=$!
          sleep 20
          screencapture -x launch.png || true
          # Small copy printed to the log, so the result is visible without
          # downloading artifacts.
          if [ -f launch.png ]; then
            sips -Z 600 -s format jpeg -s formatOptions 60 launch.png --out launch-small.jpg >/dev/null
            echo "LAUNCH_SCREENSHOT_BASE64_BEGIN"; base64 -b 76 -i launch-small.jpg; echo "LAUNCH_SCREENSHOT_BASE64_END"
          fi
          if kill -0 $PID 2>/dev/null; then
            echo "App is running"; kill $PID
          else
            echo "::error::App exited during startup"; cat launch.log; exit 1
          fi
          cat launch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-launch-check
          path: |
            launch.png
            launch.log
          if-no-files-found: ignore
      - name: Package .dmg
        run: |
          set -euo pipefail
          APP="build/macos/Build/Products/Release/${APP_NAME}.app"
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          mkdir -p dist/stage
          ditto "$APP" "dist/stage/${APP_NAME}.app"
          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "${APP_NAME}" -srcfolder dist/stage \
            -ov -format UDZO "dist/FocusFlow-${VERSION}.dmg"
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-macOS
          path: dist/*.dmg
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.all_platforms
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/FocusFlow-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-Windows
          path: dist/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  linux:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.all_platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Tarball
        run: |
          mkdir -p dist
          tar -czf dist/FocusFlow-Linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-Linux
          path: dist/*.tar.gz
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
